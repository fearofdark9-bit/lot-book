  :root{
    --ink:#1F2933; --ink-soft:#4B5A63; --paper:#F7F4EE; --paper-2:#FFFFFF;
    --line:#DDD6C7; --line-soft:#EBE6D9;
    --teal:#2C6E63; --teal-dark:#1E4F47; --teal-tint:#E4EFEC;
    --gold:#B8862E; --gold-tint:#F6ECD8;
    --rust:#A6432B; --rust-tint:#F7E7E2;
    --green:#3F7D4E; --green-tint:#E8F2E9;
    --radius:10px;
    --shadow: 0 1px 2px rgba(31,41,51,.06), 0 4px 14px rgba(31,41,51,.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:'IBM Plex Sans',system-ui,sans-serif;
    font-size:14px; line-height:1.45;
    min-height:100vh;
  }
  .num{font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;}
  ::selection{background:var(--gold-tint);}
  a{color:var(--teal-dark);}

  /* ---------- Shell ---------- */
  .shell{display:flex; min-height:100vh;}
  .sidebar{
    width:220px; flex-shrink:0; background:var(--ink); color:#EDEAE1;
    display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
  }
  .brand{
    padding:22px 20px 16px; border-bottom:1px solid rgba(255,255,255,.08);
  }
  .brand .mark{
    font-family:'IBM Plex Serif',serif; font-weight:700; font-size:20px; letter-spacing:.2px;
    color:#fff; display:flex; align-items:baseline; gap:6px;
  }
  .brand .mark .dot{color:var(--gold); font-size:20px;}
  .brand .sub{font-size:11px; color:#B9B3A2; margin-top:3px; letter-spacing:.4px; text-transform:uppercase;}

  .tabs{list-style:none; margin:14px 0; padding:0; flex:1;}
  .tabs li{margin:0;}
  .tabs button{
    width:100%; text-align:left; background:none; border:none; color:#D8D3C4;
    padding:11px 20px; font-size:13.5px; cursor:pointer; display:flex; align-items:center; gap:10px;
    border-left:3px solid transparent; font-family:inherit;
  }
  .tabs button .n{
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:#8B8474; width:16px;
  }
  .tabs button:hover{background:rgba(255,255,255,.05); color:#fff;}
  .tabs button.active{
    background:rgba(255,255,255,.08); color:#fff; border-left-color:var(--gold);
  }
  .tabs button.active .n{color:var(--gold);}
  .sidebar-foot{
    padding:14px 20px 18px; font-size:10.5px; color:#8B8474; border-top:1px solid rgba(255,255,255,.08);
    line-height:1.6;
  }
  .backup-btn{
    display:block; width:100%; text-align:left; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12);
    color:#D8D3C4; font-size:11px; font-weight:600; padding:7px 10px; border-radius:6px; margin-top:6px;
    cursor:pointer; font-family:inherit;
  }
  .backup-btn:hover{background:rgba(255,255,255,.12); color:#fff;}


  .main{flex:1; min-width:0; padding:26px 34px 60px;}
  .topbar{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; gap:16px; flex-wrap:wrap;
  }
  .topbar h1{
    font-family:'IBM Plex Serif',serif; font-size:22px; font-weight:700; margin:0; color:var(--ink);
  }
  .topbar .desc{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
  .fy-picker{display:flex; align-items:center; gap:8px;}
  .fy-picker label{font-size:11.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--ink-soft); font-weight:600;}
  select, input, textarea{
    font-family:inherit; font-size:13.5px; padding:8px 10px; border:1px solid var(--line);
    border-radius:7px; background:#fff; color:var(--ink);
  }
  select:focus, input:focus, textarea:focus{outline:2px solid var(--teal); outline-offset:1px;}
  .fy-picker select{
    background:var(--paper-2); border:1px solid var(--line); font-weight:600; color:var(--teal-dark);
    padding:7px 12px;
  }

  /* ---------- Cards / KPIs ---------- */
  .kpi-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:22px;}
  .kpi{
    background:var(--paper-2); border:1px solid var(--line-soft); border-radius:var(--radius);
    padding:14px 16px; box-shadow:var(--shadow);
  }
  .kpi .label{font-size:10.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--ink-soft); font-weight:600;}
  .kpi .value{font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:600; margin-top:6px; color:var(--ink);}
  .kpi.accent .value{color:var(--teal-dark);}
  .kpi.gold .value{color:var(--gold);}
  .kpi.good .value{color:var(--green);}
  .kpi.bad .value{color:var(--rust);}

  .card{
    background:var(--paper-2); border:1px solid var(--line-soft); border-radius:var(--radius);
    box-shadow:var(--shadow); margin-bottom:20px; overflow:hidden;
  }
  .card-head{
    padding:14px 18px; border-bottom:1px solid var(--line-soft); display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
  }
  .card-head h2{font-size:14px; margin:0; font-weight:600; color:var(--ink);}
  .card-body{padding:16px 18px;}
  .charts-grid{display:grid; grid-template-columns:1.1fr 1.4fr; gap:16px;}
  @media(max-width:900px){.charts-grid{grid-template-columns:1fr;}}
  .chart-wrap{position:relative; height:230px;}

  /* ---------- Tables ---------- */
  table{width:100%; border-collapse:collapse; font-size:13px;}
  thead th{
    text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.4px;
    color:var(--ink-soft); font-weight:600; padding:8px 10px; border-bottom:2px solid var(--line);
    background:var(--paper); position:sticky; top:0;
  }
  tbody td{padding:8px 10px; border-bottom:1px solid var(--line-soft); vertical-align:top;}
  tbody tr:hover{background:var(--teal-tint);}
  td.num, th.num{text-align:right; font-family:'IBM Plex Mono',monospace;}
  .table-scroll{max-height:60vh; overflow:auto; border-radius:8px;}
  .pill{
    display:inline-block; padding:2px 9px; border-radius:99px; font-size:11px; font-weight:600;
  }
  .pill.teal{background:var(--teal-tint); color:var(--teal-dark);}
  .pill.gold{background:var(--gold-tint); color:var(--gold);}
  .pill.rust{background:var(--rust-tint); color:var(--rust);}
  .pill.green{background:var(--green-tint); color:var(--green);}
  .muted{color:var(--ink-soft);}
  .row-actions{white-space:nowrap; position:sticky; right:0; background:var(--paper-2); box-shadow:-6px 0 8px -6px rgba(0,0,0,.08);}
  tbody tr:hover .row-actions{background:var(--teal-tint);}
  .row-actions button{
    background:var(--paper); border:1px solid var(--line); cursor:pointer; color:var(--ink-soft);
    font-size:11.5px; font-weight:600; padding:5px 10px; border-radius:6px; font-family:inherit;
    display:inline-flex; align-items:center; gap:4px; margin-right:4px;
  }
  .row-actions button:hover{background:var(--teal-tint); color:var(--teal-dark); border-color:var(--teal);}
  .row-actions .del-btn:hover{background:var(--rust-tint); color:var(--rust); border-color:var(--rust);}
  .stmt-btn{
    background:var(--gold-tint); border:1px solid var(--gold); color:#8a6520; cursor:pointer;
    font-size:11.5px; font-weight:600; padding:5px 10px; border-radius:6px; font-family:inherit;
  }
  .stmt-btn:hover{background:var(--gold); color:#fff;}
  .price-ref-panel{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;}
  .price-ref-box{
    flex:1; min-width:130px; background:var(--paper); border:1px solid var(--line); border-radius:8px;
    padding:10px 14px;
  }
  .price-ref-box .lbl{display:block; font-size:10px; text-transform:uppercase; letter-spacing:.3px; color:var(--ink-soft); font-weight:700; margin-bottom:3px;}
  .price-ref-box .val{font-family:'IBM Plex Mono',monospace; font-size:16px; font-weight:700; color:var(--ink);}
  .price-ref-box.highlight{background:var(--teal-tint); border-color:var(--teal); cursor:pointer;}
  .price-ref-box.highlight .lbl, .price-ref-box.highlight .val{color:var(--teal-dark);}
  .price-ref-box.highlight:hover{background:var(--teal); }
  .price-ref-box.highlight:hover .lbl, .price-ref-box.highlight:hover .val{color:#fff;}
  .tap-hint{font-size:10px; font-weight:500; display:block;}
  .empty-state{
    padding:40px 20px; text-align:center; color:var(--ink-soft);
  }
  .empty-state .stub{
    font-family:'IBM Plex Serif',serif; font-size:15px; color:var(--ink); margin-bottom:4px;
  }

  /* ---------- Entry form (chalan-styled) ---------- */
  .chalan{
    background:var(--paper-2); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); max-width:720px; overflow:hidden;
  }
  .chalan-head{
    background:var(--ink); color:#EDEAE1; padding:16px 22px; display:flex; align-items:center; justify-content:space-between;
    background-image: repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 1px, transparent 1px 14px);
  }
  .chalan-head .no{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--gold);}
  .chalan-head h2{font-family:'IBM Plex Serif',serif; font-size:16px; margin:2px 0 0;}
  .type-select{padding:16px 22px 6px;}
  .type-select label{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--ink-soft); font-weight:600; margin-bottom:6px;}
  .type-select select{width:100%; padding:11px 12px; font-size:14.5px; font-weight:600; color:var(--teal-dark);}
  .field-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:14px 16px; padding:16px 22px;
  }
  .field-grid.narrow{grid-template-columns:1fr;}
  .field{display:flex; flex-direction:column; gap:5px;}
  .field.span2{grid-column:1/-1;}
  .field label{font-size:11.5px; color:var(--ink-soft); font-weight:600;}
  .field input, .field select{width:100%;}
  .computed-amount{
    margin:2px 22px 6px; padding:12px 16px; background:var(--gold-tint); border-radius:8px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .computed-amount .lbl{font-size:11.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--gold); font-weight:700;}
  .computed-amount .val{font-family:'IBM Plex Mono',monospace; font-size:20px; font-weight:700; color:#8a6520;}
  .chalan-foot{
    padding:16px 22px 22px; display:flex; gap:10px; align-items:center; border-top:1px dashed var(--line);
  }
  .btn{
    border:none; border-radius:8px; padding:10px 20px; font-size:13.5px; font-weight:600; cursor:pointer;
    font-family:inherit;
  }
  .btn-primary{background:var(--teal); color:#fff;}
  .btn-primary:hover{background:var(--teal-dark);}
  .btn-ghost{background:none; color:var(--ink-soft); border:1px solid var(--line);}
  .btn-ghost:hover{background:var(--paper);}
  .save-msg{font-size:12.5px; color:var(--green); font-weight:600; opacity:0; transition:opacity .25s;}
  .save-msg.show{opacity:1;}

  .filter-bar{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  .filter-bar input, .filter-bar select{padding:7px 10px; font-size:12.5px;}

  .type-tag{font-size:10.5px; padding:2px 8px; border-radius:5px; font-weight:600; white-space:nowrap;}
  .tag-Production{background:var(--teal-tint); color:var(--teal-dark);}
  .tag-Expense{background:var(--rust-tint); color:var(--rust);}
  .tag-Sales{background:var(--gold-tint); color:var(--gold);}
  .tag-Payments{background:var(--green-tint); color:var(--green);}

  footer.note{font-size:11.5px; color:var(--ink-soft); margin-top:30px; max-width:720px;}

  /* ---------- Statement overlay (printable) ---------- */
  .statement-overlay{
    position:fixed; inset:0; background:rgba(31,41,51,.55); z-index:200;
    display:flex; align-items:flex-start; justify-content:center; padding:30px 16px; overflow:auto;
  }
  .statement-box{
    background:#fff; width:100%; max-width:680px; border-radius:10px; overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.3);
  }
  .statement-toolbar{
    display:flex; align-items:center; gap:10px; padding:12px 16px; background:var(--paper); border-bottom:1px solid var(--line);
  }
  .statement-content{padding:34px 38px;}
  .stmt-head{display:flex; justify-content:space-between; align-items:flex-start; border-bottom:2px solid var(--ink); padding-bottom:16px; margin-bottom:20px;}
  .stmt-head .brandmark{font-family:'IBM Plex Serif',serif; font-weight:700; font-size:19px; color:var(--ink);}
  .stmt-head .brandmark .dot{color:var(--gold);}
  .stmt-head .meta{text-align:right; font-size:12px; color:var(--ink-soft);}
  .stmt-title{font-size:12px; text-transform:uppercase; letter-spacing:.6px; color:var(--ink-soft); font-weight:700; margin-bottom:4px;}
  .stmt-name{font-family:'IBM Plex Serif',serif; font-size:20px; font-weight:700; color:var(--ink); margin-bottom:22px;}
  .stmt-summary{display:flex; gap:22px; margin-bottom:24px; flex-wrap:wrap;}
  .stmt-summary .item{}
  .stmt-summary .item .l{font-size:10.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--ink-soft); font-weight:600;}
  .stmt-summary .item .v{font-family:'IBM Plex Mono',monospace; font-size:18px; font-weight:700; color:var(--ink); margin-top:2px;}
  .stmt-summary .item.balance .v{color:var(--rust);}
  .stmt-table{width:100%; border-collapse:collapse; font-size:12.5px; margin-bottom:10px;}
  .stmt-table th{text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:.3px; color:var(--ink-soft); border-bottom:1.5px solid var(--ink); padding:6px 8px;}
  .stmt-table td{padding:6px 8px; border-bottom:1px solid var(--line-soft);}
  .stmt-table td.num, .stmt-table th.num{text-align:right; font-family:'IBM Plex Mono',monospace;}
  .stmt-section-title{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--teal-dark); margin:22px 0 8px;}
  .stmt-foot{margin-top:26px; padding-top:14px; border-top:1px dashed var(--line); font-size:11px; color:var(--ink-soft);}

  @media print{
    body *{visibility:hidden;}
    .statement-box, .statement-box *{visibility:visible;}
    .statement-overlay{position:absolute; inset:auto; padding:0; background:none;}
    .statement-box{box-shadow:none; max-width:100%;}
    .no-print{display:none !important;}
  }
  /* ---------- Mobile responsive (placed last so it wins over base rules) ---------- */
  @media(max-width:760px){
    .shell{flex-direction:column;}
    .sidebar{
      width:100%; height:auto; position:sticky; top:0; z-index:50; flex-direction:row; align-items:center;
      flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch;
    }
    .brand{padding:12px 14px; border-bottom:none; border-right:1px solid rgba(255,255,255,.08); flex-shrink:0;}
    .brand .mark{font-size:16px;}
    .brand .sub{display:none;}
    .tabs{display:flex; flex-direction:row; margin:0; flex:0 0 auto;}
    .tabs button{
      padding:14px 14px; white-space:nowrap; border-left:none; border-bottom:3px solid transparent; flex-direction:column; gap:2px;
    }
    .tabs button.active{border-left-color:transparent; border-bottom-color:var(--gold);}
    .sidebar-foot{
      display:flex; flex-direction:row; gap:6px; border-top:none; border-left:1px solid rgba(255,255,255,.08);
      padding:8px 10px; flex-shrink:0; align-items:center; white-space:nowrap;
    }
    .sidebar-foot > .save-note{display:none;}
    .backup-btn{margin-top:0; padding:8px 10px; white-space:nowrap;}
    .main{padding:16px 14px 40px;}
    .topbar h1{font-size:19px;}
    .field-grid{grid-template-columns:1fr; padding:14px 16px;}
    .chalan{max-width:100%;}
    .kpi-row{grid-template-columns:repeat(2,1fr);}
    .charts-grid{grid-template-columns:1fr;}
    .price-ref-panel{flex-direction:column;}
    .statement-content{padding:20px 18px;}
    .stmt-summary{gap:14px;}
    .statement-overlay{padding:0; align-items:stretch;}
    .statement-box{max-width:100%; border-radius:0; min-height:100vh;}
  }
  @media(max-width:420px){
    .kpi-row{grid-template-columns:1fr 1fr;}
    .kpi .value{font-size:18px;}
  }

  /* ---------- Auth screen ---------- */
  .auth-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--ink); padding:20px;
  }
  .auth-card{
    background:#fff; border-radius:12px; padding:34px 32px; width:100%; max-width:380px; box-shadow:0 20px 60px rgba(0,0,0,.35);
  }
  .auth-brand{font-family:'IBM Plex Serif',serif; font-weight:700; font-size:24px; color:var(--ink); text-align:center;}
  .auth-brand .dot{color:var(--gold);}
  .auth-sub{font-size:12.5px; color:var(--ink-soft); text-align:center; margin-bottom:26px;}
  .auth-note{font-size:11.5px; color:var(--ink-soft); text-align:center; margin-top:14px; line-height:1.5;}
  .auth-error{
    background:var(--rust-tint); color:var(--rust); font-size:12.5px; font-weight:600; padding:9px 12px;
    border-radius:7px; margin-bottom:14px;
  }
</style>
</head>
<body>

<div id="authScreen" class="auth-screen">
  <div class="auth-card">
    <div class="auth-brand">Lot Book<span class="dot">.</span></div>
    <div class="auth-sub">Factory Ledger — sign in to your workspace</div>
    <div id="authError" class="auth-error" style="display:none;"></div>
    <div class="field" style="margin-bottom:12px;">
      <label>Email</label>
      <input id="authEmail" type="email" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="field" style="margin-bottom:16px;">
      <label>Password</label>
      <input id="authPassword" type="password" placeholder="At least 6 characters" autocomplete="current-password">
    </div>
    <button id="loginBtn" class="btn btn-primary" style="width:100%; margin-bottom:8px;">Log In</button>
    <button id="signupBtn" class="btn btn-ghost" style="width:100%;">Create Account</button>
    <div class="auth-note">First time here? Click "Create Account" once — after that, always use "Log In".</div>
  </div>
</div>

<div class="shell" id="appShell" style="display:none;">
  <nav class="sidebar">
    <div class="brand">
      <div class="mark">Lot Book<span class="dot">.</span></div>
      <div class="sub">Factory Ledger</div>
    </div>
    <ul class="tabs" id="tabs">
      <li><button data-tab="entry" class="active"><span class="n">01</span> New Entry</button></li>
      <li><button data-tab="records"><span class="n">02</span> All Records</button></li>
      <li><button data-tab="ledger"><span class="n">03</span> Party Ledger</button></li>
      <li><button data-tab="lots"><span class="n">04</span> Lot Costing</button></li>
      <li><button data-tab="fabric"><span class="n">05</span> Fabric Stock</button></li>
      <li><button data-tab="buyers"><span class="n">06</span> Buyer Ledger</button></li>
      <li><button data-tab="workers"><span class="n">07</span> Karigar Ledger</button></li>
      <li><button data-tab="staff"><span class="n">08</span> Staff &amp; Kharcha</button></li>
      <li><button data-tab="cash"><span class="n">09</span> Cash Flow</button></li>
      <li><button data-tab="dashboard"><span class="n">10</span> Dashboard</button></li>
    </ul>
    <div class="sidebar-foot">
      <span class="save-note" id="userEmailNote">Signed in</span>
      <button id="exportBtn" class="backup-btn">⬇ Export Backup</button>
      <button id="importBtn" class="backup-btn">⬆ Import Backup</button>
      <button id="logoutBtn" class="backup-btn">⏻ Log Out</button>
      <input type="file" id="importFile" accept=".json" style="display:none;">
    </div>
  </nav>

  <main class="main">
    <div class="topbar">
      <div>
        <h1 id="pageTitle">New Entry</h1>
        <div class="desc" id="pageDesc">One form. Pick what happened, fill it in, save.</div>
      </div>
      <div class="fy-picker">
        <label>Year</label>
        <select id="fySelect"><option value="All">All years</option></select>
      </div>
    </div>

    <div id="view"></div>
  </main>
</div>

<div id="statementOverlay" class="statement-overlay" style="display:none;">
  <div class="statement-box">
    <div class="statement-toolbar no-print">
      <button class="btn btn-ghost" id="closeStatementBtn">✕ Close</button>
      <div style="flex:1;"></div>
      <button class="btn btn-ghost" id="waStatementBtn">Share on WhatsApp</button>
      <button class="btn btn-primary" id="printStatementBtn">Print / Save as PDF</button>
    </div>
    <div id="statementContent" class="statement-content"></div>
  </div>
</div>

<script>
/* =========================================================
   STORAGE
   ========================================================= */

   SUPABASE CONFIG — fill these in from your Supabase project
   Project Settings → API → Project URL / anon public key
   ========================================================= */

const CONFIGURED = SUPABASE_URL.startsWith('http') && SUPABASE_ANON_KEY.length > 20;
const sb = CONFIGURED ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

let ENTRIES = [];
let currentUser = null;
let SETTINGS = {overheadInHouse: 60, overheadJobWork: 30, id: null};

async function loadEntries(){
  if(!sb || !currentUser){ ENTRIES = []; return; }
  try{
    const {data, error} = await sb.from('entries').select('id, payload').order('id', {ascending:true});
    if(error) throw error;
    ENTRIES = (data||[]).map(r => ({...r.payload, id:r.id}));
    const sIdx = ENTRIES.findIndex(e=>e.type==='_settings');
    if(sIdx>=0){
      const s = ENTRIES[sIdx];
      SETTINGS.overheadInHouse = s.overheadInHouse!==undefined ? num(s.overheadInHouse) : num(s.overheadPerPiece||60);
      SETTINGS.overheadJobWork = s.overheadJobWork!==undefined ? num(s.overheadJobWork) : 30;
      SETTINGS.id = s.id;
      ENTRIES.splice(sIdx,1);
    }else{
      SETTINGS = {overheadInHouse: 60, overheadJobWork: 30, id: null};
    }
  }catch(e){ console.error('load failed', e); ENTRIES = []; }
}
async function insertEntry(entry){
  const {data, error} = await sb.from('entries').insert({payload:entry, user_id:currentUser.id}).select('id').single();
  if(error) throw error;
  entry.id = data.id;
  return entry;
}
async function updateEntry(entry){
  const {error} = await sb.from('entries').update({payload:entry}).eq('id', entry.id);
  if(error) throw error;
}
async function deleteEntry(id){
  const {error} = await sb.from('entries').delete().eq('id', id);
  if(error) throw error;
}
async function saveSettings(newInHouse, newJobWork){
  const valIn = num(newInHouse);
  const valJob = num(newJobWork);
  const payload = {type:'_settings', overheadInHouse: valIn, overheadJobWork: valJob};
  try{
    if(SETTINGS.id){
      const {error} = await sb.from('entries').update({payload}).eq('id', SETTINGS.id);
      if(error) throw error;
    }else{
      const {data, error} = await sb.from('entries').insert({payload, user_id:currentUser.id}).select('id').single();
      if(error) throw error;
      SETTINGS.id = data.id;
    }
    SETTINGS.overheadInHouse = valIn;
    SETTINGS.overheadJobWork = valJob;
    return true;
  }catch(e){ console.error('settings save failed', e); return false; }
}

function num(v){ const n = parseFloat(v); return isNaN(n) ? 0 : n; }
function normName(s){ return (s===undefined||s===null) ? '' : String(s).trim().toLowerCase(); }
function sameName(a,b){ return normName(a)===normName(b) && normName(a)!==''; }
function uniqueItems(){
  const set = new Set();
  ENTRIES.forEach(e=>{ if(e.item) set.add(e.item); if(e.itemPick) set.add(e.itemPick); });
  return [...set].sort();
}
function uniqueValuesForFields(fields){
  const set = new Set();
  ENTRIES.forEach(e=>{
    fields.forEach(f=>{ if(e[f]) set.add(String(e[f]).trim()); });
  });
  return [...set].filter(Boolean).sort();
}

function fyOf(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr+'T00:00:00');
  if(isNaN(d)) return null;
  const y = d.getFullYear();
  const cutoff = new Date(y,7,6);
  const startYear = d>=cutoff ? y : y-1;
  return startYear+'-'+String(startYear+1).slice(-2);
}
function money(n){
  if(n===null||n===undefined||n==='') return '—';
  const v = Math.round(n);
  return v.toLocaleString('en-IN');
}
function fmtDate(s){
  if(!s) return '—';
  const d = new Date(s+'T00:00:00');
  if(isNaN(d)) return s;
  return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'2-digit'});
}

document.getElementById('tabs').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-tab]');
  if(!btn) return;
  currentTab = btn.dataset.tab;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active', b===btn));
  editingId = null;
  render();
});
document.getElementById('fySelect').addEventListener('change', e=>{
  currentFY = e.target.value;
  render();
});

function refreshFYOptions(){
  const sel = document.getElementById('fySelect');
  const fys = new Set();
  ENTRIES.forEach(e=>{ const fy = fyOf(e.date); if(fy) fys.add(fy); });
  const sorted = [...fys].sort();
  const prev = sel.value || 'All';
  sel.innerHTML = '<option value="All">All years</option>' + sorted.map(f=>`<option value="${f}">${f}</option>`).join('');
  sel.value = sorted.includes(prev) ? prev : 'All';
  currentFY = sel.value;
}

function entriesInFY(list){
  let result = currentFY==='All' ? list : list.filter(e=> fyOf(e.date)===currentFY );
  if(MONTH_OVERRIDE){
    result = result.filter(e=> e.date && e.date.slice(0,7)===MONTH_OVERRIDE);
  }
  return result;
}

  document.getElementById('pageTitle').textContent = TITLES[currentTab].t;

  if(currentTab==='entry') view.innerHTML = renderEntryForm();
  else if(currentTab==='records') view.innerHTML = renderRecords();
  else if(currentTab==='ledger') view.innerHTML = renderPartyLedger();
  else if(currentTab==='lots') view.innerHTML = renderLots();
  else if(currentTab==='fabric') view.innerHTML = renderFabricStock();
  else if(currentTab==='buyers') view.innerHTML = renderBuyers();
  else if(currentTab==='workers') view.innerHTML = renderWorkers();
  else if(currentTab==='staff') view.innerHTML = renderStaff();
  else if(currentTab==='cash') view.innerHTML = renderCash();
  else if(currentTab==='dashboard') view.innerHTML = renderDashboard();

  if(currentTab==='entry') bindEntryForm();

function renderEntryForm(){
  const editEntry = editingId ? ENTRIES.find(e=>e.id===editingId) : null;
  const selectedType = editEntry ? editEntry.type : (window.__lastType || 'cutting');
  const typeOptionsByGroup = {};
  Object.entries(TYPES).forEach(([key,cfg])=>{
    (typeOptionsByGroup[cfg.group] = typeOptionsByGroup[cfg.group]||[]).push([key,cfg.label]);
  });
  const groupHtml = Object.entries(typeOptionsByGroup).map(([g,opts])=>
    `<optgroup label="${g}">` + opts.map(([k,l])=>`<option value="${k}" ${k===selectedType?'selected':''}>${l}</option>`).join('') + `</optgroup>`
  ).join('');

  return `
    <div class="chalan">
      <div class="chalan-head">
        <div>
          <div class="no">${editEntry ? 'EDITING ENTRY #'+editEntry.id : 'NEW ENTRY'}</div>
          <h2>What happened?</h2>
        </div>
      </div>
      <div class="type-select">
        <label>Entry type</label>
        <select id="typeSelect">${groupHtml}</select>
      </div>
      <div id="fieldsArea"></div>
      <div id="computedArea"></div>
      <div class="chalan-foot">
        <button class="btn btn-primary" id="saveBtn">${editEntry ? 'Save changes' : 'Save entry'}</button>
        ${editEntry ? '<button class="btn btn-ghost" id="cancelEditBtn">Cancel</button>' : '<button class="btn btn-ghost" id="clearBtn">Clear</button>'}
        <span class="save-msg" id="saveMsg">Saved ✓</span>
      </div>
    </div>
    <footer class="note">Every field maps straight onto your lot, buyer, and cash records — nothing needs to be entered twice.</footer>
  `;
}

function fieldHtml(key, value){
  const meta = FIELD_META[key];
  const val = value===undefined||value===null ? '' : value;
  if(meta.type==='select'){
    return `<div class="field"><label>${meta.label}${meta.req?' *':''}</label>
      <select data-field="${key}">
        <option value="">Select…</option>
        ${meta.options.map(o=>`<option value="${o}" ${o===val?'selected':''}>${o}</option>`).join('')}
      </select></div>`;
  }
  if(meta.type==='combo'){
    return `<div class="field"><label>${meta.label}${meta.req?' *':''}</label>
      <input data-field="${key}" type="text" list="${meta.listId}" value="${val}" placeholder="${meta.ph||''}"></div>`;
  }
  return `<div class="field"><label>${meta.label}${meta.req?' *':''}</label>
    <input data-field="${key}" type="${meta.type}" value="${val}" placeholder="${meta.ph||''}"></div>`;
}

function ensureDatalist(id){
  let dl = document.getElementById(id);
  if(!dl){
    dl = document.createElement('datalist');
    dl.id = id;
    document.body.appendChild(dl);
  }
  return dl;
}

function bindEntryForm(){
  const typeSelect = document.getElementById('typeSelect');
  const fieldsArea = document.getElementById('fieldsArea');
  const computedArea = document.getElementById('computedArea');
  const editEntry = editingId ? ENTRIES.find(e=>e.id===editingId) : null;

  function paintFields(){
    const type = typeSelect.value;
    window.__lastType = type;
    const cfg = TYPES[type];
    const isBillType = (type==='sale' || type==='saleOther');
    const data = editEntry && editEntry.type===type ? editEntry :
      {date:new Date().toISOString().slice(0,10), ...(cfg.defaults||{}), ...((isBillType && carryOverBill) ? carryOverBill : {})};
    refreshAllDatalists();
    const banner = (!editEntry && isBillType && carryOverBill) ? `
      <div class="computed-amount" style="background:var(--gold-tint); margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;">
        <span class="lbl" style="color:#8a6520;">📋 Adding another item to Challan ${carryOverBill.saleChallanNo||'—'} \u2014 ${carryOverBill.buyer||''}</span>
        <button type="button" id="startNewBillBtn" class="stmt-btn" style="padding:5px 10px; font-size:11px;">Start New Bill</button>
      </div>` : '';
    fieldsArea.innerHTML = banner + `<div class="field-grid">` + cfg.fields.map(f=>fieldHtml(f, data[f])).join('') +
      fieldHtml('remark', data.remark) + `</div>`;
    // default date to today if blank
    const dateInput = fieldsArea.querySelector('[data-field="date"]');
    if(dateInput && !dateInput.value) dateInput.value = new Date().toISOString().slice(0,10);
    paintComputed();
    fieldsArea.querySelectorAll('input,select').forEach(el=>{
      el.addEventListener('input', paintComputed);
    });
    const newBillBtn = document.getElementById('startNewBillBtn');
    if(newBillBtn) newBillBtn.addEventListener('click', ()=>{ carryOverBill = null; paintFields(); });
  }

  function paintComputed(){
    const type = typeSelect.value;
    const cfg = TYPES[type];
    const data = {};
    fieldsArea.querySelectorAll('[data-field]').forEach(el=>{ data[el.dataset.field]=el.value; });
    let html = '';
    if(cfg.amountFn){
      html += `<div class="computed-amount"><span class="lbl">Amount</span><span class="val">₹ ${money(cfg.amountFn(data))}</span></div>`;
    }
    if(cfg.extraPanel){
      html += cfg.extraPanel(data);
    }
    computedArea.innerHTML = html;
  }

  typeSelect.addEventListener('change', paintFields);
  paintFields();

  document.getElementById('saveBtn').addEventListener('click', async ()=>{
    const type = typeSelect.value;
    const cfg = TYPES[type];
    const data = {type};
    if(editEntry) data.id = editEntry.id;
    let ok = true;
    fieldsArea.querySelectorAll('[data-field]').forEach(el=>{
      data[el.dataset.field] = el.value;
      if(FIELD_META[el.dataset.field].req && !el.value){ ok=false; el.style.borderColor='var(--rust)'; }
      else{ el.style.borderColor=''; }
    });
    if(!ok){ 
      const msg = document.getElementById('saveMsg');
      msg.textContent = 'Fill the required fields (*)'; msg.style.color='var(--rust)'; msg.classList.add('show');
      setTimeout(()=>msg.classList.remove('show'), 2200);
      return;
    }
    data.amount = cfg.amountFn ? cfg.amountFn(data) : num(data.amount);
    data.fy = fyOf(data.date);

    const msg = document.getElementById('saveMsg');
    const splitSecondFabric = !editEntry && type==='cutting' && num(data.meters2)>0 && num(data.rate2)>0;
    try{
      if(editEntry){
        await updateEntry(data);
        const idx = ENTRIES.findIndex(e=>e.id===editEntry.id);
        ENTRIES[idx] = data;
        editingId = null;
      }else if(splitSecondFabric){
        const entry2 = {
          type: 'cutting',
          date: data.date, lotNo: data.lotNo, factoryNo: data.factoryNo,
          fabric: data.fabric2, item: data.item, meters: data.meters2, rate: data.rate2,
          party: data.vendor2, totalPieces: '0', cuttingWastage: data.wastage2||'',
          size: data.size, productionMode: data.productionMode, deliveryDate: data.deliveryDate,
          remark: '2nd fabric \u2014 linked to Lot ' + (data.lotNo||''),
        };
        entry2.amount = num(entry2.meters)*num(entry2.rate);
        entry2.fy = fyOf(entry2.date);
        delete data.fabric2; delete data.vendor2; delete data.meters2; delete data.rate2; delete data.wastage2;
        await insertEntry(data);
        ENTRIES.push(data);
        await insertEntry(entry2);
        ENTRIES.push(entry2);
      }else{
        await insertEntry(data);
        ENTRIES.push(data);
      }
      refreshFYOptions();
      if(!editEntry && (type==='sale' || type==='saleOther')){
        carryOverBill = {date: data.date, saleChallanNo: data.saleChallanNo, buyer: data.buyer};
      }
      msg.textContent = splitSecondFabric ? 'Saved \u2713 (2 entries, one per fabric)' : 'Saved ✓';
      msg.style.color='var(--green)'; msg.classList.add('show');
      setTimeout(()=>msg.classList.remove('show'), 2200);
      if(editEntry){ render(); } else { paintFields(); }
    }catch(err){
      console.error(err);
      msg.textContent = 'Save failed — check your connection'; msg.style.color='var(--rust)'; msg.classList.add('show');
      setTimeout(()=>msg.classList.remove('show'), 3000);
    }
  });

  const clearBtn = document.getElementById('clearBtn');
  if(clearBtn) clearBtn.addEventListener('click', paintFields);
  const cancelBtn = document.getElementById('cancelEditBtn');
  if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ editingId=null; render(); });
}

function findPossibleDuplicates(){
  const groups = {};
  ENTRIES.forEach(e=>{
    const name = e.karigar||e.vendor||e.unit||e.person||e.buyer||e.party2||e.supplier||e.party||'';
    const key = [e.type, e.date, name, e.lotNo||'', e.amount].join('|');
    if(!groups[key]) groups[key] = [];
    groups[key].push(e);
  });
  return Object.values(groups).filter(g=>g.length>1);
}

function renderRecords(){
  const dupGroups = findPossibleDuplicates();
  const dupCount = dupGroups.reduce((s,g)=>s+g.length,0);
  const dupBanner = dupGroups.length ? `

      </div>
      <div class="card-body" style="font-size:12.5px; color:var(--ink-soft);">
        Same type, date, name, lot, and amount — likely entered twice by mistake. Click "Review them" to check and delete extras.

function recordDisplayName(e){
  if(e.type==='directPayment') return `${e.buyer||'?'} → ${e.party2||'?'}`;
  return e.karigar || e.vendor || e.person || e.buyer || e.party2 || e.unit || e.party || e.supplier || e.partyName || '—';
}

function bindRecords(){
  const body = document.getElementById('recordsBody');
  const search = document.getElementById('searchBox');
  const typeFilter = document.getElementById('typeFilter');
  const fromDate = document.getElementById('recordsFromDate');
  const toDate = document.getElementById('recordsToDate');
  const todayBtn = document.getElementById('recordsTodayBtn');
  const clearDateBtn = document.getElementById('recordsClearDateBtn');
  let dupFilterIds = null;

  function paint(){
    let list = entriesInFY(ENTRIES).slice().sort((a,b)=> (b.date||'').localeCompare(a.date||'') || b.id-a.id);
    if(dupFilterIds){ list = list.filter(e=>dupFilterIds.has(e.id)); }
    const q = search.value.trim().toLowerCase();
    if(q){
      list = list.filter(e => JSON.stringify(e).toLowerCase().includes(q));
    }
    if(typeFilter.value){ list = list.filter(e=>e.type===typeFilter.value); }
    if(fromDate.value){ list = list.filter(e=>e.date && e.date>=fromDate.value); }
    if(toDate.value){ list = list.filter(e=>e.date && e.date<=toDate.value); }

    if(list.length===0){
      const msg = dupFilterIds ? 'No duplicates in this view (they may have already been cleaned up).' : 'Add your first one from New Entry.';
      body.innerHTML = `<tr><td colspan="7"><div class="empty-state"><div class="stub">No entries</div>${msg}</div></td></tr>`;
      return;
    }
    body.innerHTML = list.map(e=>{
      const cfg = TYPES[e.type];
      const isDup = dupFilterIds && dupFilterIds.has(e.id);
      return `<tr ${isDup?'style="background:var(--rust-tint);"':''}>
        <td>${fmtDate(e.date)}</td>
        <td><span class="type-tag tag-${cfg.group}">${cfg.label.split(' — ')[0]}</span></td>
        <td>${e.lotNo || '<span class="muted">—</span>'}</td>
        <td>${recordDisplayName(e)}</td>
        <td class="num">${e.pieces ? money(e.pieces) : '<span class="muted">—</span>'}</td>
        <td class="num">₹ ${money(e.amount)}</td>
        <td class="row-actions">
          <button class="edit-btn" data-edit="${e.id}" title="Edit this entry">✎ Edit</button>
          <button class="del-btn" data-del="${e.id}" title="Delete this entry">✕ Delete</button>
        </td>
      </tr>`;
    }).join('');

    body.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click', ()=>{
      editingId = parseInt(b.dataset.edit);
      currentTab = 'entry';
      document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('active', x.dataset.tab==='entry'));
      render();
    }));
    body.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', async ()=>{
      if(!confirm('Delete this entry? This cannot be undone.')) return;
      const id = parseInt(b.dataset.del);
      try{
        await deleteEntry(id);
        ENTRIES = ENTRIES.filter(e=>e.id!==id);
        refreshFYOptions();
        if(dupFilterIds) dupFilterIds.delete(id);
        paint();
      }catch(err){
        console.error(err);
        alert('Could not delete — check your connection and try again.');
      }
    }));
  }
  search.addEventListener('input', ()=>{ dupFilterIds = null; paint(); });
  typeFilter.addEventListener('change', ()=>{ dupFilterIds = null; paint(); });
  fromDate.addEventListener('change', ()=>{ dupFilterIds = null; paint(); });
  toDate.addEventListener('change', ()=>{ dupFilterIds = null; paint(); });
  todayBtn.addEventListener('click', ()=>{
    const today = new Date().toISOString().slice(0,10);
    fromDate.value = today; toDate.value = today;
    dupFilterIds = null; paint();
  });
  clearDateBtn.addEventListener('click', ()=>{
    fromDate.value=''; toDate.value='';
    dupFilterIds = null; paint();
  });
  const showDupsBtn = document.getElementById('showDupsBtn');
  if(showDupsBtn){
    showDupsBtn.addEventListener('click', ()=>{
      const groups = findPossibleDuplicates();
      dupFilterIds = new Set();
      groups.forEach(g=>g.forEach(e=>dupFilterIds.add(e.id)));
      typeFilter.value = '';
      search.value = '';
      paint();
    });
  }
  paint();
}

const LEDGER_TYPE_MAP = {
  cutting:      null, // not party-linked
  fabricReceived: {field:'party', direction:'charge', label:'Fabric Received', hasPieces:false},
  jobwork:      {field:'vendor', direction:'charge', label:'Job Work', hasPieces:true},
  stitching:    {field:'karigar', direction:'charge', label:'Stitching', hasPieces:true},
  dhaga:        {field:'karigar', direction:'charge', label:'Dhaga Cutting', hasPieces:true},
  pressman:     {field:'karigar', direction:'charge', label:'Pressman', hasPieces:true},
  processwork:  {field:'unit', direction:'charge', label:e=>`Process Work (${e.processType||'\u2014'})`, hasPieces:true},
  salary:       {field:'person', direction:'charge', label:'Salary', hasPieces:false},
  extra:        {field:'person', direction:'charge', label:'Extra Expense', hasPieces:false},
  materialBill: {field:'supplier', direction:'charge', label:'Dhaga / Material Bill', hasPieces:false},
  kharcha:      {field:'person', direction:'payment', label:'Kharcha / Advance', hasPieces:false},
  sale:         {field:'buyer', direction:'charge', label:e=>`Sale${e.saleChallanNo?' (Challan '+e.saleChallanNo+')':''}`, hasPieces:true},
  saleOther:    {field:'buyer', direction:'charge', label:e=>`Sale${e.saleChallanNo?' (Challan '+e.saleChallanNo+')':''}`, hasPieces:true},
  paymentReceived:{field:'buyer', direction:'payment', label:e=>`Payment Received (${e.source||'\u2014'})`, hasPieces:false},
  paymentGiven: {field:'party2', direction:'payment', label:e=>`Payment Given \u2014 ${e.purpose||'\u2014'} (${e.source||'\u2014'})`, hasPieces:false},
};

function allPartyNames(){
  const set = new Set();
  ENTRIES.forEach(e=>{
    const cfg = LEDGER_TYPE_MAP[e.type];
    if(cfg && e[cfg.field]) set.add(String(e[cfg.field]).trim());
    if(e.type==='directPayment'){
      if(e.buyer) set.add(String(e.buyer).trim());
      if(e.party2) set.add(String(e.party2).trim());
    }
    if(e.type==='openingBalance' && e.partyName) set.add(String(e.partyName).trim());
  });
  return [...set].sort();
}

function itemForLot(lotNo){
  if(!lotNo) return '';
  const e = ENTRIES.find(x=>x.type==='cutting' && x.lotNo===lotNo && x.item);
  return e ? e.item : '';
}

function computePartyLedger(name){
  const list = entriesInFY(ENTRIES);
  const rows = [];
  list.forEach(e=>{
    if(e.type==='openingBalance' && sameName(e.partyName,name)){
      const amt = num(e.amount);
      rows.push({date:e.date, lotNo:'', item:'', pieces:null, rate:null,
        particulars:'Opening Balance (carried forward from Excel)',
        charge: amt>=0?amt:0, payment: amt<0?-amt:0});
      return;
    }
    if(e.type==='directPayment'){
      if(sameName(e.buyer,name)){
        rows.push({date:e.date, lotNo:e.lotNo||'', item: itemForLot(e.lotNo), pieces:null, rate:null,
          particulars:`Direct Payment \u2014 paid to ${e.party2||'labour'}`, charge:0, payment:num(e.amount)});
      }
      if(sameName(e.party2,name)){
        rows.push({date:e.date, lotNo:e.lotNo||'', item: itemForLot(e.lotNo), pieces:null, rate:null,
          particulars:`Direct Payment \u2014 received from ${e.buyer||'buyer'}`, charge:0, payment:num(e.amount)});
      }
      return;
    }
    const cfg = LEDGER_TYPE_MAP[e.type];
    if(!cfg || !sameName(e[cfg.field],name)) return;
    const amt = num(e.amount);
    const label = typeof cfg.label==='function' ? cfg.label(e) : cfg.label;
    rows.push({
      date:e.date,
      lotNo: e.lotNo||'',
      item: cfg.hasPieces ? (e.itemPick||e.item||itemForLot(e.lotNo)) : '',
      pieces: cfg.hasPieces ? num(e.pieces) : null,
      rate: cfg.hasPieces ? num(e.rate!==undefined&&e.rate!==''?e.rate:e.saleRate) : null,
      particulars: label,
      charge: cfg.direction==='charge' ? amt : 0,
      payment: cfg.direction==='payment' ? amt : 0,
    });
  });
  rows.sort((a,b)=> (a.date||'').localeCompare(b.date||''));
  let running = 0;
  rows.forEach(r=>{ running += r.charge - r.payment; r.balance = running; });
  return {name, rows, balance: running};
}

function renderLedgerTable(name, filters){
  filters = filters || {};
  if(!name){
    return `<div class="card"><div class="card-body"><div class="empty-state"><div class="stub">No name selected</div>Type a name above and tap "Show Ledger".</div></div></div>`;
  }
  const l = computePartyLedger(name);
  if(l.rows.length===0){
    return `<div class="card"><div class="card-body"><div class="empty-state"><div class="stub">No records found for "${name}"</div>Check the spelling matches exactly what you've typed elsewhere.</div></div></div>`;
  }
  const monthKey = (d)=>{ if(!d) return ''; const dt=new Date(d+'T00:00:00'); return isNaN(dt)?'':(dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')); };
  const monthLabel = (k)=>{ const [y,m]=k.split('-'); return calendar_month_abbr(parseInt(m))+'-'+y.slice(2); };

  const hasDateRange = !!(filters.from || filters.to);
  let visibleRows = l.rows;
  let filterLabel = '';
  if(hasDateRange){
    visibleRows = l.rows.filter(r=>{
      if(!r.date) return false;
      if(filters.from && r.date < filters.from) return false;
      if(filters.to && r.date > filters.to) return false;
      return true;
    });
    if(filters.from && filters.to && filters.from===filters.to) filterLabel = ' — ' + fmtDate(filters.from);
    else filterLabel = ' — ' + (filters.from?fmtDate(filters.from):'start') + ' to ' + (filters.to?fmtDate(filters.to):'today');
  }else if(filters.month){
    visibleRows = l.rows.filter(r=>monthKey(r.date)===filters.month);
    filterLabel = ' — ' + monthLabel(filters.month);
  }
  const isFiltered = hasDateRange || filters.month;

  const rowsHtml = visibleRows.map(r=>`
    <tr>
      <td>${fmtDate(r.date)}</td>
      <td class="num">${r.lotNo||'<span class="muted">—</span>'}</td>
      <td>${r.item||'<span class="muted">—</span>'}</td>
      <td>${r.particulars}</td>
      <td class="num">${r.pieces!==null ? money(r.pieces) : ''}</td>
      <td class="num">${r.rate!==null && !isNaN(r.rate) ? '₹ '+r.rate.toFixed(2) : ''}</td>
      <td class="num">${r.charge? money(r.charge) : ''}</td>
      <td class="num">${r.payment? money(r.payment) : ''}</td>
      <td class="num" style="font-weight:600;">₹ ${money(r.balance)}</td>
    </tr>`).join('');

  const totPieces = visibleRows.reduce((s,r)=>s+(r.pieces||0),0);
  const totCharge = visibleRows.reduce((s,r)=>s+r.charge,0);
  const totPayment = visibleRows.reduce((s,r)=>s+r.payment,0);
  const totBalance = totCharge - totPayment;

  return `
    <div class="kpi-row">
      <div class="kpi gold"><div class="label">${isFiltered?'Billed / Work Done (filtered)':'Total Billed / Work Done'}</div><div class="value">₹ ${money(totCharge)}</div></div>
      <div class="kpi accent"><div class="label">${isFiltered?'Paid / Received (filtered)':'Total Paid / Received'}</div><div class="value">₹ ${money(totPayment)}</div></div>

function calendar_month_abbr(m){
  return ['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m]||'';
}

function bindPartyLedger(){
  const input = document.getElementById('ledgerNameInput');
  const btn = document.getElementById('ledgerGoBtn');
  const result = document.getElementById('ledgerResult');
  const monthFilter = document.getElementById('ledgerMonthFilter');
  const fromDate = document.getElementById('ledgerFromDate');
  const toDate = document.getElementById('ledgerToDate');
  const todayBtn = document.getElementById('ledgerTodayBtn');
  const clearDateBtn = document.getElementById('ledgerClearDateBtn');

  function refreshMonthOptions(name){
    const l = computePartyLedger(name);
    const monthKey = (d)=>{ if(!d) return ''; const dt=new Date(d+'T00:00:00'); return isNaN(dt)?'':(dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')); };
    const months = [...new Set(l.rows.map(r=>monthKey(r.date)).filter(Boolean))].sort();
    monthFilter.innerHTML = '<option value="">All Months</option>' + months.map(k=>{
      const [y,m] = k.split('-');
      return `<option value="${k}">${calendar_month_abbr(parseInt(m))}-${y.slice(2)}</option>`;
    }).join('');
  }

  function show(){
    const name = input.value.trim();
    if(name) refreshMonthOptions(name);
    result.innerHTML = renderLedgerTable(name, {
      month: monthFilter.value,
      from: fromDate.value,
      to: toDate.value,
    });
  }
  btn.addEventListener('click', show);
  input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') show(); });
  monthFilter.addEventListener('change', ()=>{ fromDate.value=''; toDate.value=''; show(); });
  fromDate.addEventListener('change', ()=>{ monthFilter.value=''; show(); });
  toDate.addEventListener('change', ()=>{ monthFilter.value=''; show(); });
  todayBtn.addEventListener('click', ()=>{
    const today = new Date().toISOString().slice(0,10);
    monthFilter.value = '';
    fromDate.value = today;
    toDate.value = today;
    show();
  });
  clearDateBtn.addEventListener('click', ()=>{
    fromDate.value=''; toDate.value=''; monthFilter.value='';
    show();
  });

  const obBtn = document.getElementById('addOpeningBalanceBtn');
  if(obBtn){
    obBtn.addEventListener('click', ()=>{
      window.__lastType = 'openingBalance';
      currentTab = 'entry';
      document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('active', x.dataset.tab==='entry'));
      render();
    });
  }
}

/* =========================================================
   COMPUTED: LOT COSTING
   ========================================================= */
function computeLots(){
  const list = entriesInFY(ENTRIES);
  const lots = {};
  function ensure(lotNo, date){
    if(!lots[lotNo]) lots[lotNo] = {
      lotNo, date, item:'', factoryNo:'', pieces:0, meters:0, wastage:0, cuttingCost:0, jobWorkCost:0, stitchingCost:0,
      perPieceCost:0, processCost:0, delivered:0, saleAmount:0, buyers:new Set(),
      jobWorkPieces:0, stitchingPieces:0
    };
    if(date && (!lots[lotNo].date || date < lots[lotNo].date)) lots[lotNo].date = date;
  }
  list.filter(e=>e.type==='cutting' && e.lotNo).forEach(e=>{
    ensure(e.lotNo, e.date);
    const l = lots[e.lotNo];
    l.pieces += num(e.totalPieces);
    l.meters += num(e.meters);
    l.wastage += num(e.cuttingWastage);
    l.cuttingCost += num(e.meters)*num(e.rate);
    if(!l.item && e.item) l.item = e.item;
    if(!l.factoryNo && e.factoryNo) l.factoryNo = e.factoryNo;
  });
  list.filter(e=>e.type==='jobwork' && e.lotNo).forEach(e=>{
    ensure(e.lotNo,e.date); lots[e.lotNo].jobWorkCost += num(e.amount); lots[e.lotNo].jobWorkPieces += num(e.pieces);
  });
  list.filter(e=>e.type==='stitching' && e.lotNo).forEach(e=>{
    ensure(e.lotNo,e.date); lots[e.lotNo].stitchingCost += num(e.amount); lots[e.lotNo].stitchingPieces += num(e.pieces);
  });
  list.filter(e=>['dhaga','pressman'].includes(e.type) && e.lotNo).forEach(e=>{ ensure(e.lotNo,e.date); lots[e.lotNo].perPieceCost += num(e.amount); });
  list.filter(e=>e.type==='processwork' && e.lotNo).forEach(e=>{ ensure(e.lotNo,e.date); lots[e.lotNo].processCost += num(e.amount); });
  list.filter(e=>e.type==='sale' && e.lotNo).forEach(e=>{
    ensure(e.lotNo,e.date);
    const l = lots[e.lotNo];
    l.delivered += num(e.pieces);
    l.saleAmount += num(e.amount);
    if(e.buyer) l.buyers.add(e.buyer);
  });
  list.filter(e=>e.type==='saleOther' && e.lotNo).forEach(e=>{
    ensure(e.lotNo,e.date);
    const l = lots[e.lotNo];
    l.delivered += num(e.pieces);
    l.saleAmount += num(e.amount);
    if(e.buyer) l.buyers.add(e.buyer);
  });

  return Object.values(lots).map(l=>{
    const overheadCost = (l.stitchingPieces * (SETTINGS.overheadInHouse||0)) + (l.jobWorkPieces * (SETTINGS.overheadJobWork||0));
    const totalCost = l.cuttingCost+l.jobWorkCost+l.stitchingCost+l.perPieceCost+l.processCost+overheadCost;
    const costPerPiece = l.pieces ? totalCost/l.pieces : 0;
    const inStock = l.pieces - l.delivered;
    const profit = l.delivered>0 ? l.saleAmount-totalCost : null;
    const avgPerPiece = l.pieces ? (l.meters/l.pieces) : 0;
    const netAvgPerPiece = l.pieces ? ((l.meters-l.wastage)/l.pieces) : 0;
    let source = '-';
    if(l.jobWorkCost>0 && l.stitchingCost>0) source='Mixed';
    else if(l.jobWorkCost>0) source='Outsourced';
    else if(l.stitchingCost>0) source='In-House';
    return {...l, overheadCost, totalCost, costPerPiece, inStock, profit, source, avgPerPiece, netAvgPerPiece,
      deliveredTo: l.buyers.size ? [...l.buyers].join(', ') : '-'};
  }).sort((a,b)=> a.lotNo.localeCompare(b.lotNo, undefined, {numeric:true}));
}

/* =========================================================
   COMPUTED: FABRIC STOCK / BALANCE
   ========================================================= */
function computeFabricBalance(){
  const list = entriesInFY(ENTRIES);
  const fabrics = {};
  function ensure(name){ if(!fabrics[name]) fabrics[name] = {name, received:0, receivedPieces:0, receivedAmt:0, used:0, lots:new Set()}; }
  list.filter(e=>e.type==='fabricReceived' && e.fabric).forEach(e=>{
    ensure(e.fabric);
    fabrics[e.fabric].received += num(e.metersOpt);
    fabrics[e.fabric].receivedPieces += num(e.fabricPieces);
    fabrics[e.fabric].receivedAmt += num(e.amount)||0;
  });
  list.filter(e=>e.type==='cutting' && e.fabric).forEach(e=>{
    ensure(e.fabric); fabrics[e.fabric].used += num(e.meters);
    if(e.lotNo) fabrics[e.fabric].lots.add(e.lotNo);
  });
  return Object.values(fabrics).map(f=>({...f, balance: f.received-f.used, lotCount: f.lots.size}))
    .sort((a,b)=> b.received-a.received);
}

function renderFabricStock(){
  const fabrics = computeFabricBalance();
  const totals = fabrics.reduce((a,f)=>({received:a.received+f.received, receivedPieces:a.receivedPieces+f.receivedPieces, used:a.used+f.used, balance:a.balance+f.balance}),{received:0,receivedPieces:0,used:0,balance:0});

  return `

      <div class="kpi"><div class="label">Total Used (Cutting)</div><div class="value">${totals.used.toFixed(0)} m</div></div>
      <div class="kpi ${totals.balance<0?'bad':'good'}"><div class="label">Balance in Stock (m)</div><div class="value">${totals.balance.toFixed(0)} m</div></div>
    </div>

      <div class="card-head"><h2>Fabric-by-fabric balance</h2></div>
      <div class="card-body" style="padding:0;">
        <div class="table-scroll">

            <thead><tr><th>Fabric</th><th class="num">Received (m)</th><th class="num">Received (pcs)</th><th class="num">Used in Cutting (m)</th><th class="num">Balance (m)</th><th class="num">Lots Cut</th></tr></thead>

/* =========================================================
   COMPUTED: STAFF SALARY & KHARCHA
   ========================================================= */
function computeStaffKharcha(){
  const list = entriesInFY(ENTRIES);
  const staff = {};
  function ensure(name){
    const key = normName(name);
    if(!key) return null;
    if(!staff[key]) staff[key] = {name: String(name).trim(), salary:0, kharcha:0};
    return staff[key];
  }
  list.filter(e=>e.type==='salary' && e.person).forEach(e=>{ const s=ensure(e.person); if(s) s.salary += num(e.amount); });
  list.filter(e=>e.type==='kharcha' && e.person).forEach(e=>{ const s=ensure(e.person); if(s) s.kharcha += num(e.amount); });
  list.filter(e=>e.type==='openingBalance' && e.partyRole==='Staff' && e.partyName).forEach(e=>{
    const s = ensure(e.partyName);
    if(!s) return;
    const amt = num(e.amount);
    if(amt>=0) s.salary += amt; else s.kharcha += -amt;
  });
  return Object.values(staff).map(s=>({...s, net: s.salary-s.kharcha})).sort((a,b)=> b.salary-a.salary);
}

function renderStaff(){
  const staff = computeStaffKharcha();
  const totals = staff.reduce((a,s)=>({salary:a.salary+s.salary, kharcha:a.kharcha+s.kharcha, net:a.net+s.net}),{salary:0,kharcha:0,net:0});
  const rows = staff.length ? staff.map(s=>`

/* =========================================================
   COMPUTED: BUYER LEDGER
   ========================================================= */
function computeBuyers(){
  const list = entriesInFY(ENTRIES);
  const buyers = {};
  function ensure(name){
    const key = normName(name);
    if(!key) return null;
    if(!buyers[key]) buyers[key] = {name: String(name).trim(), pieces:0, billed:0, received:0, profit:0};
    return buyers[key];
  }
  list.filter(e=>e.type==='sale' && e.buyer).forEach(e=>{
    const b=ensure(e.buyer); if(b){ b.pieces += num(e.pieces); b.billed += num(e.amount); }
  });
  list.filter(e=>e.type==='saleOther' && e.buyer).forEach(e=>{
    const b=ensure(e.buyer); if(b){ b.pieces += num(e.pieces); b.billed += num(e.amount); }
  });
  list.filter(e=>e.type==='paymentReceived' && e.buyer).forEach(e=>{
    const b=ensure(e.buyer); if(b) b.received += num(e.amount);
  });
  list.filter(e=>e.type==='directPayment' && e.buyer).forEach(e=>{
    const b=ensure(e.buyer); if(b) b.received += num(e.amount);
  });
  list.filter(e=>e.type==='openingBalance' && e.partyRole==='Buyer' && e.partyName).forEach(e=>{
    const b = ensure(e.partyName);
    if(!b) return;
    const amt = num(e.amount);
    if(amt>=0) b.billed += amt; else b.received += -amt;
  });
  // profit only computable for lot-tracked sales, using lot cost/piece
  const lots = computeLots();
  const lotMap = {}; lots.forEach(l=>lotMap[l.lotNo]=l);
  list.filter(e=>(e.type==='sale' || e.type==='saleOther') && e.buyer && e.lotNo).forEach(e=>{
    const l = lotMap[e.lotNo];
    const b = buyers[normName(e.buyer)];
    if(l && l.pieces && b){ b.profit += num(e.amount) - (l.costPerPiece*num(e.pieces)); }
  });
  return Object.values(buyers).map(b=>({...b, balance: b.billed-b.received}))
    .sort((a,b)=> b.billed - a.billed);
}

function computeBuyerDetail(){
  const list = entriesInFY(ENTRIES);
  const lots = computeLots();
  const lotMap = {}; lots.forEach(l=>lotMap[l.lotNo]=l);
  const rows = [];
  list.filter(e=>e.type==='sale' && e.buyer).forEach(e=>{
    const l = lotMap[e.lotNo];
    const profit = l ? (num(e.amount) - l.costPerPiece*num(e.pieces)) : null;
    rows.push({buyer:e.buyer, challanNo:e.saleChallanNo||'—', lotNo:e.lotNo||'—', item: (l&&l.item)?l.item:(e.itemPick||'—'), date:e.date,
      pieces:num(e.pieces), saleAmount:num(e.amount), profit});
  });
  list.filter(e=>e.type==='saleOther' && e.buyer).forEach(e=>{
    const l = lotMap[e.lotNo];
    const profit = l ? (num(e.amount) - l.costPerPiece*num(e.pieces)) : null;
    rows.push({buyer:e.buyer, challanNo:e.saleChallanNo||'—', lotNo:e.lotNo||'—', item: (l&&l.item)?l.item:(e.itemPick||'—'), date:e.date,
      pieces:num(e.pieces), saleAmount:num(e.amount), profit});
  });
  return rows.sort((a,b)=> a.buyer.localeCompare(b.buyer) || (b.date||'').localeCompare(a.date||''));
}

/* =========================================================
   COMPUTED: KARIGAR / JOB-WORK LEDGER
   ========================================================= */
const PROD_PURPOSES = ['Job Work','Stitching','Dhaga Cutting','Pressman','Process Work'];

function computeWorkers(){
  const list = entriesInFY(ENTRIES);
  const workers = {};
  function ensure(name, category){
    const key = normName(name);
    if(!key) return null;
    if(!workers[key]) workers[key] = {name: String(name).trim(), categories:new Set(), pieces:0, earned:0, paid:0};
    workers[key].categories.add(category);
    return workers[key];
  }
  list.filter(e=>e.type==='stitching' && e.karigar).forEach(e=>{
    const w=ensure(e.karigar,'Stitching'); if(w){ w.pieces+=num(e.pieces); w.earned+=num(e.amount); }
  });
  list.filter(e=>e.type==='jobwork' && e.vendor).forEach(e=>{
    const w=ensure(e.vendor,'Job Work'); if(w){ w.pieces+=num(e.pieces); w.earned+=num(e.amount); }
  });
  list.filter(e=>['dhaga','pressman'].includes(e.type) && e.karigar).forEach(e=>{
    const catName = e.type==='dhaga'?'Dhaga Cutting':'Pressman';
    const w=ensure(e.karigar,catName); if(w){ w.pieces+=num(e.pieces); w.earned+=num(e.amount); }
  });
  list.filter(e=>e.type==='processwork' && e.unit).forEach(e=>{
    const w=ensure(e.unit,'Process Work'); if(w){ w.pieces+=num(e.pieces); w.earned+=num(e.amount); }
  });
  list.filter(e=>e.type==='paymentGiven' && e.party2 && PROD_PURPOSES.includes(e.purpose)).forEach(e=>{
    const w=ensure(e.party2, e.purpose); if(w) w.paid += num(e.amount);
  });
  list.filter(e=>e.type==='directPayment' && e.party2 && PROD_PURPOSES.includes(e.purpose)).forEach(e=>{
    const w=ensure(e.party2, e.purpose); if(w) w.paid += num(e.amount);
  });
  list.filter(e=>e.type==='openingBalance' && e.partyRole==='Karigar / Job Work' && e.partyName).forEach(e=>{
    const w = ensure(e.partyName, 'Opening Balance');
    if(!w) return;
    const amt = num(e.amount);
    if(amt>=0) w.earned += amt; else w.paid += -amt;
  });
  return Object.values(workers).map(w=>({...w, balance:w.earned-w.paid, categories:[...w.categories].join(', ')}))
    .sort((a,b)=> b.balance-a.balance);
}

function renderWorkers(){
  const workers = computeWorkers();
  const totals = workers.reduce((a,w)=>({earned:a.earned+w.earned, paid:a.paid+w.paid, balance:a.balance+w.balance}),{earned:0,paid:0,balance:0});

/* =========================================================
   COMPUTED: CASH FLOW
   ========================================================= */
function computeCash(){
  const list = entriesInFY(ENTRIES);
  const received = list.filter(e=>e.type==='paymentReceived').reduce((s,e)=>s+num(e.amount),0);
  const given = list.filter(e=>e.type==='paymentGiven').reduce((s,e)=>s+num(e.amount),0);
  return {received, given, net: received-given};
}

    return;
  }
  const lots = computeLots();

    cutting:a.cutting+l.cuttingCost, jobwork:a.jobwork+l.jobWorkCost,
    stitching:a.stitching+l.stitchingCost, perpiece:a.perpiece+l.perPieceCost, process:a.process+l.processCost,

  }), {cutting:0,jobwork:0,stitching:0,perpiece:0,process:0,overhead:0});

  const costCtx = document.getElementById('costChart');
  if(chartCost) chartCost.destroy();
  chartCost = new Chart(costCtx, {
    type:'doughnut',
    data:{
      labels:['Fabric/Cutting','Job Work','Stitching','Per-Piece Work','Process Work','Overhead'],
      datasets:[{data:[totals.cutting,totals.jobwork,totals.stitching,totals.perpiece,totals.process,totals.overhead],
        backgroundColor:['#2C6E63','#B8862E','#3F7D4E','#7A8FA6','#A6432B','#6B5B95'], borderWidth:0}]
    },
    options:{plugins:{legend:{position:'bottom', labels:{font:{family:"'IBM Plex Sans'"}, boxWidth:11, padding:12}}}, cutout:'60%'}
  });

  // monthly trend from cutting entries in current FY
  const list = entriesInFY(ENTRIES).filter(e=>e.type==='cutting' && e.date);
  const monthMap = {};
  list.forEach(e=>{
    const d = new Date(e.date+'T00:00:00');
    const key = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    if(!monthMap[key]) monthMap[key]={pieces:0, cost:0, label:d.toLocaleDateString('en-GB',{month:'short',year:'2-digit'})};
    monthMap[key].pieces += num(e.totalPieces);
    monthMap[key].cost += num(e.meters)*num(e.rate);
  });
  const keys = Object.keys(monthMap).sort();
  const trendCtx = document.getElementById('trendChart');
  if(chartTrend) chartTrend.destroy();
  chartTrend = new Chart(trendCtx, {
    data:{
      labels: keys.map(k=>monthMap[k].label),
      datasets:[
        {type:'bar', label:'Pieces', data:keys.map(k=>monthMap[k].pieces), backgroundColor:'#2C6E63', yAxisID:'y'},
        {type:'line', label:'Cost (₹)', data:keys.map(k=>monthMap[k].cost), borderColor:'#B8862E', backgroundColor:'#B8862E', yAxisID:'y1', tension:.3}

    },

      scales:{
        y:{position:'left', title:{display:true,text:'Pieces'}},
        y1:{position:'right', grid:{drawOnChartArea:false}, title:{display:true,text:'Cost (₹)'}}
      },
      plugins:{legend:{position:'bottom', labels:{font:{family:"'IBM Plex Sans'"}}}}
    }
  });
}

function computeBuyerStatement(name){
  const detail = computeBuyerDetail().filter(d=>sameName(d.buyer,name));
  const payments = entriesInFY(ENTRIES).filter(e=>(e.type==='paymentReceived' || e.type==='directPayment') && sameName(e.buyer,name))
    .sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const billed = detail.reduce((s,d)=>s+d.saleAmount,0);
  const received = payments.reduce((s,e)=>s+num(e.amount),0);
  return {name, detail, payments, billed, received, balance: billed-received};
}
function computeWorkerStatement(name){
  const list = entriesInFY(ENTRIES);
  const work = [];
  list.filter(e=>e.type==='stitching' && sameName(e.karigar,name)).forEach(e=>work.push({date:e.date, lotNo:e.lotNo, type:'Stitching', pieces:num(e.pieces), rate:num(e.rate), amount:num(e.amount)}));
  list.filter(e=>e.type==='jobwork' && sameName(e.vendor,name)).forEach(e=>work.push({date:e.date, lotNo:e.lotNo, type:'Job Work', pieces:num(e.pieces), rate:num(e.rate), amount:num(e.amount)}));
  list.filter(e=>['dhaga','pressman'].includes(e.type) && sameName(e.karigar,name)).forEach(e=>work.push({date:e.date, lotNo:e.lotNo, type:e.type==='dhaga'?'Dhaga Cutting':'Pressman', pieces:num(e.pieces), rate:num(e.rate), amount:num(e.amount)}));
  list.filter(e=>e.type==='processwork' && sameName(e.unit,name)).forEach(e=>work.push({date:e.date, lotNo:e.lotNo, type:'Process Work', pieces:num(e.pieces), rate:num(e.rate), amount:num(e.amount)}));
  work.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const payments = list.filter(e=>(e.type==='paymentGiven' || e.type==='directPayment') && sameName(e.party2,name) && PROD_PURPOSES.includes(e.purpose))
    .sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const earned = work.reduce((s,w)=>s+w.amount,0);
  const paid = payments.reduce((s,e)=>s+num(e.amount),0);
  return {name, work, payments, earned, paid, balance: earned-paid};
}

function computeStaffStatement(name){
  const list = entriesInFY(ENTRIES);
  const salaryLog = list.filter(e=>e.type==='salary' && sameName(e.person,name)).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const kharchaLog = list.filter(e=>e.type==='kharcha' && sameName(e.person,name)).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const salary = salaryLog.reduce((s,e)=>s+num(e.amount),0);
  const kharcha = kharchaLog.reduce((s,e)=>s+num(e.amount),0);
  return {name, salaryLog, kharchaLog, salary, kharcha, net: salary-kharcha};
}
function computeSupplierStatement(name){
  const list = entriesInFY(ENTRIES);
  const bills = list.filter(e=>e.type==='materialBill' && sameName(e.supplier,name)).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const payments = list.filter(e=>e.type==='paymentGiven' && sameName(e.party2,name) && e.purpose==='Dhaga / Material Bill').sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const billed = bills.reduce((s,e)=>s+num(e.amount),0);
  const paid = payments.reduce((s,e)=>s+num(e.amount),0);
  return {name, bills, payments, billed, paid, balance: billed-paid};
}

function monthLabelFull(monthKey){
  const [y,m] = monthKey.split('-');
  const names = ['','January','February','March','April','May','June','July','August','September','October','November','December'];
  return names[parseInt(m)] + ' ' + y;
}

function computeWenzerArtReport(){
  const list = entriesInFY(ENTRIES).filter(e=>(e.type==='sale'||e.type==='saleOther') && sameName(e.buyer,'WENZER ART'))
    .sort((a,b)=>(a.date||'').localeCompare(b.date||'') || (a.id-b.id));
  const lots = computeLots();
  const lotMap = {}; lots.forEach(l=>lotMap[l.lotNo]=l);
  let no = 0;
  const rows = list.map(e=>{
    no++;
    const pieces = num(e.pieces);
    const l = lotMap[e.lotNo];
    const wspRate = num(e.wspPrice);
    const wspAmount = wspRate * pieces;
    const override = num(e.actualCostOverride);
    const actualRate = override>0 ? override : (l ? l.costPerPiece : 0);
    const actualAmount = actualRate * pieces;
    const saleRate = num(e.saleRate!==undefined && e.saleRate!=='' ? e.saleRate : e.rate);
    const saleAmount = num(e.amount);
    const difference = saleAmount - actualAmount;
    return {no, challanNo:e.saleChallanNo||'—', lotNo:e.lotNo||'—', date:e.date, pieces,
      wspRate, wspAmount, actualRate, actualAmount, saleRate, saleAmount, difference};
  });
  const totals = rows.reduce((a,r)=>({
    pieces:a.pieces+r.pieces, wspAmount:a.wspAmount+r.wspAmount, actualAmount:a.actualAmount+r.actualAmount,
    saleAmount:a.saleAmount+r.saleAmount, difference:a.difference+r.difference
  }), {pieces:0, wspAmount:0, actualAmount:0, saleAmount:0, difference:0});
  return {rows, totals};
}

      </div>
      <div class="stmt-section-title">Work Done</div>
      <table class="stmt-table"><thead><tr><th>Date</th><th>Lot</th><th>Type</th><th class="num">Pieces</th><th class="num">Rate</th><th class="num">Amount</th></tr></thead>
      <tbody>${s.work.length ? s.work.map(w=>`<tr><td>${fmtDate(w.date)}</td><td>${w.lotNo||'—'}</td><td>${w.type}</td><td class="num">${money(w.pieces)}</td><td class="num">₹ ${w.rate.toFixed(2)}</td><td class="num">₹ ${money(w.amount)}</td></tr>`).join('') : '<tr><td colspan="6">No work recorded.</td></tr>'}</tbody></table>
      <div class="stmt-section-title">Payments Made</div>
      <table class="stmt-table"><thead><tr><th>Date</th><th>Lot</th><th>Source</th><th>Paid By</th><th class="num">Amount</th></tr></thead>
      <tbody>${s.payments.length ? s.payments.map(p=>`<tr><td>${fmtDate(p.date)}</td><td>${p.lotNoOpt||'<span class="muted">General</span>'}</td><td>${p.source||'—'}</td><td>${p.type==='directPayment'?('Direct from '+(p.buyer||'buyer')):'You'}</td><td class="num">₹ ${money(p.amount)}</td></tr>`).join('') : '<tr><td colspan="5">No payments recorded.</td></tr>'}</tbody></table>
      <div class="stmt-foot">Balance Owed of ₹ ${money(s.balance)} is due for settlement. Payments tagged with a Lot No above were settled bill-wise against that specific job; "General" payments were lump-sum against the running balance.</div>`;
    window.__stmtShare = `Statement for ${s.name} (${fyLabel})\nEarned: ₹${money(s.earned)}\nPaid: ₹${money(s.paid)}\nBalance Owed: ₹${money(s.balance)}`;
  }else if(type==='staff'){
    const s = computeStaffStatement(name);
    html += `<div class="stmt-title">Staff Salary Statement</div><div class="stmt-name">${s.name}</div>
      <div class="stmt-summary">
        <div class="item"><div class="l">Salary Logged</div><div class="v">₹ ${money(s.salary)}</div></div>
        <div class="item"><div class="l">Kharcha Taken</div><div class="v">₹ ${money(s.kharcha)}</div></div>
        <div class="item balance"><div class="l">Net Payable</div><div class="v" style="color:var(--green);">₹ ${money(s.net)}</div></div>
      </div>
      <div class="stmt-section-title">Salary Payments</div>
      <table class="stmt-table"><thead><tr><th>Date</th><th class="num">Amount</th></tr></thead>
      <tbody>${s.salaryLog.length ? s.salaryLog.map(e=>`<tr><td>${fmtDate(e.date)}</td><td class="num">₹ ${money(e.amount)}</td></tr>`).join('') : '<tr><td colspan="2">No salary recorded.</td></tr>'}</tbody></table>
      <div class="stmt-section-title">Kharcha / Advances</div>
      <table class="stmt-table"><thead><tr><th>Date</th><th>Remark</th><th class="num">Amount</th></tr></thead>
      <tbody>${s.kharchaLog.length ? s.kharchaLog.map(e=>`<tr><td>${fmtDate(e.date)}</td><td>${e.remark||'—'}</td><td class="num">₹ ${money(e.amount)}</td></tr>`).join('') : '<tr><td colspan="3">No kharcha recorded.</td></tr>'}</tbody></table>
      <div class="stmt-foot">Net Payable of ₹ ${money(s.net)} reflects salary logged minus kharcha taken.</div>`;
    window.__stmtShare = `Salary Statement for ${s.name} (${fyLabel})\nSalary: ₹${money(s.salary)}\nKharcha: ₹${money(s.kharcha)}\nNet Payable: ₹${money(s.net)}`;
  }else if(type==='supplier'){
    const s = computeSupplierStatement(name);
    html += `<div class="stmt-title">Supplier Statement \u2014 Dhaga / Material</div><div class="stmt-name">${s.name}</div>
      <div class="stmt-summary">
        <div class="item"><div class="l">Total Billed</div><div class="v">₹ ${money(s.billed)}</div></div>
        <div class="item"><div class="l">Total Paid</div><div class="v">₹ ${money(s.paid)}</div></div>
        <div class="item balance"><div class="l">Balance Due</div><div class="v">₹ ${money(s.balance)}</div></div>
      </div>
      <div class="stmt-section-title">Bills</div>
      <table class="stmt-table"><thead><tr><th>Date</th><th class="num">Amount</th></tr></thead>
      <tbody>${s.bills.length ? s.bills.map(e=>`<tr><td>${fmtDate(e.date)}</td><td class="num">₹ ${money(e.amount)}</td></tr>`).join('') : '<tr><td colspan="2">No bills recorded.</td></tr>'}</tbody></table>
      <div class="stmt-section-title">Payments Made</div>
      <table class="stmt-table"><thead><tr><th>Date</th><th>Source</th><th>Remark</th><th class="num">Amount</th></tr></thead>
      <tbody>${s.payments.length ? s.payments.map(p=>`<tr><td>${fmtDate(p.date)}</td><td>${p.source||'—'}</td><td>${p.remark||'—'}</td><td class="num">₹ ${money(p.amount)}</td></tr>`).join('') : '<tr><td colspan="4">No payments recorded.</td></tr>'}</tbody></table>
      <div class="stmt-foot">Balance Due of ₹ ${money(s.balance)} is payable at your convenience.</div>`;
    window.__stmtShare = `Supplier Statement for ${s.name} (${fyLabel})\nBilled: ₹${money(s.billed)}\nPaid: ₹${money(s.paid)}\nBalance Due: ₹${money(s.balance)}`;
  }

  content.innerHTML = html;
  overlay.style.display = 'flex';
}

document.getElementById('closeStatementBtn').addEventListener('click', ()=>{
  document.getElementById('statementOverlay').style.display = 'none';
});
document.getElementById('statementOverlay').addEventListener('click', (e)=>{
  if(e.target.id==='statementOverlay') document.getElementById('statementOverlay').style.display = 'none';
});
document.getElementById('printStatementBtn').addEventListener('click', ()=>{ window.print(); });
document.getElementById('waStatementBtn').addEventListener('click', ()=>{
  const text = encodeURIComponent((window.__stmtShare||'') + '\n\n(PDF attached separately \u2014 use Print / Save as PDF first, then attach it here)');
  window.open('https://wa.me/?text='+text, '_blank');
});

/* =========================================================
   BACKUP: EXPORT / IMPORT
   ========================================================= */
document.getElementById('exportBtn').addEventListener('click', ()=>{
  const payload = {app:'Lot Book', exportedAt: new Date().toISOString(), entries: ENTRIES};
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url; a.download = `lotbook-backup-${stamp}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

document.getElementById('importBtn').addEventListener('click', ()=>{
  document.getElementById('importFile').click();
});
document.getElementById('importFile').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const payload = JSON.parse(text);
    const incoming = Array.isArray(payload) ? payload : payload.entries;
    if(!Array.isArray(incoming)) throw new Error('Not a valid backup file');
    let added = 0, failed = 0;
    for(const entry of incoming){
      const clean = {...entry};
      delete clean.id; // the database assigns a fresh id — avoids clashing with existing records
      try{
        await insertEntry(clean);
        ENTRIES.push(clean);
        added++;
      }catch(err){ failed++; console.error(err); }
    }
    refreshFYOptions();
    render();
    alert(`Import complete.\n${added} entries added.${failed?('\n'+failed+' failed to import — check your connection.'):''}\n\nThis adds to your existing data — nothing was deleted or overwritten. Avoid importing the same backup file twice, since each import creates fresh entries.`);
  }catch(err){
    console.error(err);
    alert('Could not read that file. Make sure it\'s a Lot Book backup (.json) file.');
  }
  e.target.value = '';
});

/* =========================================================
   AUTH
   ========================================================= */
function showAuthError(msg){
  const el = document.getElementById('authError');
  el.textContent = msg;
  el.style.display = 'block';
}
function clearAuthError(){
  document.getElementById('authError').style.display = 'none';
}

async function startApp(user){
  currentUser = user;
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('appShell').style.display = 'flex';
  const note = document.getElementById('userEmailNote');
  if(note) note.textContent = user.email || 'Signed in';
  await loadEntries();
  refreshFYOptions();
  render();
}

function showAuthScreen(){
  currentUser = null;
  document.getElementById('appShell').style.display = 'none';
  document.getElementById('authScreen').style.display = 'flex';
}

document.getElementById('loginBtn').addEventListener('click', async ()=>{
  clearAuthError();
  if(!sb){ showAuthError('App is not configured yet — set SUPABASE_URL and SUPABASE_ANON_KEY in the code.'); return; }
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  if(!email || !password){ showAuthError('Enter your email and password.'); return; }
  const {data, error} = await sb.auth.signInWithPassword({email, password});
  if(error){ showAuthError(error.message); return; }
  await startApp(data.user);
});

document.getElementById('signupBtn').addEventListener('click', async ()=>{
  clearAuthError();
  if(!sb){ showAuthError('App is not configured yet — set SUPABASE_URL and SUPABASE_ANON_KEY in the code.'); return; }
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  if(!email || !password){ showAuthError('Enter an email and a password (6+ characters).'); return; }
  if(password.length < 6){ showAuthError('Password must be at least 6 characters.'); return; }
  const {data, error} = await sb.auth.signUp({email, password});
  if(error){ showAuthError(error.message); return; }
  if(data.session){
    await startApp(data.user);
  }else{
    showAuthError('Account created. Check your email to confirm, then log in.');
  }
});

document.getElementById('logoutBtn').addEventListener('click', async ()=>{
  if(sb) await sb.auth.signOut();
  showAuthScreen();
});

/* =========================================================
   INIT
   ========================================================= */
(async function init(){
  if(!sb){
    showAuthError('App is not configured yet — open the file, find SUPABASE_URL / SUPABASE_ANON_KEY near the top of the script, and fill them in from your Supabase project.');
    return;
  }
  const {data:{session}} = await sb.auth.getSession();
  if(session && session.user){
    await startApp(session.user);
  }
  sb.auth.onAuthStateChange((event, session)=>{
    if(event === 'SIGNED_OUT'){ showAuthScreen(); }
  });
})();
</script>
